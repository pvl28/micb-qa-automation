# Default configuration. Every key can be overridden with a JVM system property,
# e.g.  mvn test -Dbrowser=firefox -Dheadless=false
base.url=https://micb.md
browser=chrome
headless=true
window.width=1440
window.height=900
# Explicit-wait timeout (seconds) for UI conditions
timeout.seconds=15
page.load.timeout.seconds=45
# Sent by REST Assured so the site owner can identify this traffic
api.user.agent=micb-qa-automation/1.0 (educational portfolio project; low-rate)
